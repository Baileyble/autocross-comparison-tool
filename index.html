<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Sync and compare autocross run videos side by side. Mark launches, splits and notes; track times and progress." />
  <title>RaceCompare — Autocross run video comparison</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0f14'/><path d='M6 22 L13 10 L17 17 L20 13 L26 22' stroke='%23ff7a1a' stroke-width='3' fill='none' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#07090c" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark">◢</span> Race<span>Compare</span></a>
    <nav class="nav">
      <a href="#/" data-view="library">Library</a>
      <a href="#/compare" data-view="compare">Compare</a>
      <a href="#/progress" data-view="progress">Progress</a>
    </nav>
    <span class="spacer"></span>
    <span id="jobs" class="jobs" hidden></span>
    <button id="btn-import" class="btn btn-primary btn-small">⬆ Import</button>
    <button id="btn-help" class="icon-btn" title="Keyboard shortcuts (?)">?</button>
    <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
  </header>
  <main id="view" class="view">
    <noscript>This app needs JavaScript.</noscript>
  </main>
  <div id="tray" class="tray" hidden></div>
  <div id="drop-overlay" class="drop-overlay" hidden><div>Drop run videos to import</div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
